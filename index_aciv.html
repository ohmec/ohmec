<html>
  <head>
    <meta charset="utf-8" />
    <title>OHMEC — redirect</title>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (!params.has("study")) {
          params.set("study", "aciv");
        }
        location.replace("index.html" + (params.toString() ? "?" + params.toString() : "") + location.hash);
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=index.html?study=aciv" />
  </head>
  <body>
    <p>This study now lives at <a href="index.html?study=aciv">index.html?study=aciv</a>.</p>
  </body>
</html>
